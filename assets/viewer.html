<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>設計ビューア</title>
<!--
  設計ビューア テンプレート
  このファイルは編集しない。データは下の <script id="design-data"> の中身だけを差し替える。
  （scripts/build.js が自動で差し替える）
-->
<style>
:root{
  --bg:#f6f6f3; --panel:#ffffff; --ink:#1d1d1f; --sub:#62666d; --faint:#9a9ea5; --line:#e2e2dd; --soft:#f0f0ec;
  --accent:#2f6fde; --accent-soft:#e7eefc;
  --new:#1f9d55; --new-soft:#e2f4e9; --chg:#b9770e; --chg-soft:#fbf0db; --old:#7a7f87; --old-soft:#eff0f2;
  --hi:#d93025; --hi-soft:#fde8e6; --mid:#d48a00; --mid-soft:#fdf2dc; --lo:#4f8a3a; --lo-soft:#e7f2e2;
  --mono:ui-monospace,SFMono-Regular,Consolas,"Cascadia Code",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#151619; --panel:#1e1f23; --ink:#e7e7ea; --sub:#a3a7ae; --faint:#71757c; --line:#32343a; --soft:#26282d;
  --accent:#7ea9ff; --accent-soft:#233149;
  --new:#4cc38a; --new-soft:#1b3326; --chg:#efb34a; --chg-soft:#3a2e18; --old:#9aa0a8; --old-soft:#292c31;
  --hi:#ff7b6e; --hi-soft:#3d2120; --mid:#f2b84b; --mid-soft:#3a3019; --lo:#8cc66f; --lo-soft:#22301c;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.65 system-ui,-apple-system,"Segoe UI","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif}
button{font:inherit;color:inherit}
code{font-family:var(--mono);font-size:.9em;background:var(--soft);padding:1px 5px;border-radius:5px}
pre{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow:auto;margin:8px 0}
pre code{background:none;padding:0;font-size:12.5px;line-height:1.55}
p{margin:6px 0} ul{margin:6px 0;padding-left:20px} li{margin:2px 0}
h1,h2,h3{line-height:1.35}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.ttl{flex:1 1 280px;min-width:0}
.ttl h1{font-size:17px;margin:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ttl .sum{color:var(--sub);font-size:13px;margin-top:1px}
.tools{display:flex;gap:8px;align-items:center;flex:0 1 auto;width:min(100%,540px)}
#q{flex:1;min-width:0;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
#q:focus{outline:2px solid var(--accent);outline-offset:-1px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 10px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.warn{background:var(--mid-soft);border-bottom:1px solid var(--line);padding:8px 16px;font-size:13px}
.warn summary{cursor:pointer;font-weight:600}

/* ---------- layout ---------- */
.wrap{display:grid;grid-template-columns:190px minmax(0,1fr);gap:0;max-width:1280px;margin:0 auto}
nav{position:sticky;top:64px;align-self:start;padding:16px 8px 16px 16px;display:flex;flex-direction:column;gap:2px}
nav button{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;border:0;background:none;padding:7px 10px;border-radius:8px;cursor:pointer;color:var(--sub)}
nav button:hover{background:var(--soft);color:var(--ink)}
nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav .n{font-size:11px;background:var(--soft);color:var(--sub);border-radius:99px;padding:0 7px;min-width:22px;text-align:center}
nav button.on .n{background:var(--panel)}
nav .hint{margin-top:14px;padding:0 10px;font-size:11.5px;color:var(--faint);line-height:1.7}
main{padding:16px 16px 80px;min-width:0}
.sec-h{display:flex;align-items:baseline;gap:10px;margin:4px 0 12px}
.sec-h h2{font-size:18px;margin:0}
.sec-h .lead{color:var(--sub);font-size:13px}
.sec+.sec{margin-top:28px}
@media (max-width:760px){
  .wrap{grid-template-columns:1fr}
  nav{position:sticky;top:0;z-index:15;flex-direction:row;overflow-x:auto;padding:8px 12px;background:var(--bg);border-bottom:1px solid var(--line)}
  nav button{flex:0 0 auto}
  nav .hint{display:none}
  header{position:relative}
}

/* ---------- common parts ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.cards{display:grid;gap:10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.muted{color:var(--sub)} .small{font-size:12.5px}
.lbl{font-size:11.5px;font-weight:600;color:var(--sub);letter-spacing:.04em;margin:10px 0 4px}
.lbl:first-child{margin-top:0}
.b{display:inline-block;font-size:11px;font-weight:600;line-height:1.6;padding:0 8px;border-radius:99px;background:var(--soft);color:var(--sub);white-space:nowrap;vertical-align:middle}
.b.new{background:var(--new-soft);color:var(--new)} .b.changed{background:var(--chg-soft);color:var(--chg)} .b.existing{background:var(--old-soft);color:var(--old)}
.b.high{background:var(--hi-soft);color:var(--hi)} .b.mid{background:var(--mid-soft);color:var(--mid)} .b.low{background:var(--lo-soft);color:var(--lo)}
.b.draft{background:var(--soft)} .b.review{background:var(--mid-soft);color:var(--mid)} .b.approved,.b.decided{background:var(--new-soft);color:var(--new)} .b.proposed{background:var(--mid-soft);color:var(--mid)}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:0 9px;font-size:12px;line-height:22px;margin:2px 4px 2px 0;cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.missing{border-style:dashed;color:var(--faint);cursor:default}
.chip.missing:hover{border-color:var(--line);color:var(--faint)}
.click{cursor:pointer;transition:border-color .12s}
.click:hover{border-color:var(--accent)}
details>summary{cursor:pointer;list-style:none;color:var(--accent);font-size:12.5px;margin-top:6px;user-select:none}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"▸ ";display:inline-block;transition:transform .12s}
details[open]>summary::before{transform:rotate(90deg)}
details>.dbody{margin-top:6px;padding-left:12px;border-left:2px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--sub);font-weight:600;font-size:11.5px}
.empty{color:var(--faint);padding:24px;text-align:center}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--sub);align-items:center;margin-bottom:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;border:1.5px solid;vertical-align:-2px;margin-right:4px}
.diagram{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:8px;overflow-x:auto}
.diagram svg{display:block;height:auto}

/* ---------- overview ---------- */
.hero .goal{font-size:16px;font-weight:600;margin:2px 0 8px}
.hero ul{margin:0;padding-left:0;list-style:none}
.hero li{padding:4px 0 4px 22px;position:relative}
.hero li::before{content:"";position:absolute;left:6px;top:12px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:10px 0}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;cursor:pointer;text-align:left}
.tile:hover{border-color:var(--accent)}
.tile .v{font-size:22px;font-weight:700;line-height:1.2}
.tile .k{font-size:12px;color:var(--sub)}
.tile .s{font-size:11.5px;color:var(--faint)}
.tile.alert .v{color:var(--hi)}

/* ---------- architecture svg ---------- */
.arch .band{fill:var(--soft);opacity:.55}
.arch .layer{fill:var(--faint);font-size:11.5px;font-weight:600}
.arch .node{cursor:pointer}
.arch .node rect{fill:var(--panel);stroke:var(--line);stroke-width:1.5}
.arch .node.st-new rect{fill:var(--new-soft);stroke:var(--new)}
.arch .node.st-changed rect{fill:var(--chg-soft);stroke:var(--chg)}
.arch .node.st-existing rect{fill:var(--old-soft);stroke:var(--old)}
.arch .node.k-external rect{stroke-dasharray:5 4}
.arch .node .nm{fill:var(--ink);font-size:13px;font-weight:600}
.arch .node .kd{fill:var(--sub);font-size:11px}
.arch .node:hover rect{stroke:var(--accent);stroke-width:2}
.arch .edge path{fill:none;stroke:var(--faint);stroke-width:1.4}
.arch .edge text{fill:var(--sub);font-size:11px}
.arch .edge .lb{fill:var(--panel);stroke:var(--line);stroke-width:1}
.arch .node,.arch .edge{transition:opacity .15s}
.arch.focus .node:not(.on),.arch.focus .edge:not(.on){opacity:.18}
.arch.focus .edge.on path{stroke:var(--accent);stroke-width:2}
.arch.focus .edge.on text{fill:var(--accent)}
.arch.focus .edge.on .lb{stroke:var(--accent)}
svg .mk{fill:var(--faint)}
.cl-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cl-row b{font-size:14px}

/* ---------- sequence ---------- */
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.pill{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:4px 12px;cursor:pointer;font-size:13px}
.pill.on{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.seq .life{stroke:var(--line);stroke-dasharray:4 4}
.seq .pt rect{fill:var(--panel);stroke:var(--line);stroke-width:1.5}
.seq .pt text{fill:var(--ink);font-size:12.5px;font-weight:600}
.seq .pt.ref{cursor:pointer}
.seq .pt.on rect{stroke:var(--accent);fill:var(--accent-soft)}
.seq .st{cursor:pointer}
.seq .st line,.seq .st path{stroke:var(--faint);stroke-width:1.4;fill:none}
.seq .st.reply line,.seq .st.reply path{stroke-dasharray:5 4}
.seq .st text{fill:var(--sub);font-size:11.5px}
.seq .st .hit{fill:transparent;stroke:none}
.seq .st:hover text{fill:var(--ink)}
.seq .st.cur line,.seq .st.cur path{stroke:var(--accent);stroke-width:2.2}
.seq .st.cur text{fill:var(--accent);font-weight:700}
.seq .mk-cur{fill:var(--accent)}
.stepper{display:flex;align-items:center;gap:10px;margin:10px 0}
.stepper .pos{font-variant-numeric:tabular-nums;color:var(--sub);font-size:13px;min-width:80px;text-align:center}
.stepd .head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.num{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--panel);font-size:12px;font-weight:700;flex:0 0 auto}
.stepd .lab{font-weight:600;font-size:15px;margin:6px 0 2px}

/* ---------- api / decisions / tasks ---------- */
.m{font-family:var(--mono);font-size:11px;font-weight:700;padding:1px 7px;border-radius:5px;background:var(--soft);color:var(--sub)}
.m.GET{background:var(--new-soft);color:var(--new)} .m.POST{background:var(--accent-soft);color:var(--accent)}
.m.PUT,.m.PATCH{background:var(--chg-soft);color:var(--chg)} .m.DELETE{background:var(--hi-soft);color:var(--hi)}
.api-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chosen{background:var(--new-soft);border-radius:8px;padding:8px 10px;margin:8px 0}
.chosen .k{font-size:11.5px;color:var(--new);font-weight:700}
.alts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.alt{border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.pro,.con{list-style:none;padding:0;margin:4px 0;font-size:12.5px}
.pro li::before{content:"＋ ";color:var(--new);font-weight:700}
.con li::before{content:"－ ";color:var(--hi);font-weight:700}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:2px}
.dot.high{background:var(--hi)} .dot.mid{background:var(--mid)} .dot.low{background:var(--lo)}
.chkrow{display:flex;gap:10px;align-items:flex-start}
.chkrow input{margin-top:5px;width:16px;height:16px;accent-color:var(--accent);flex:0 0 auto;cursor:pointer}
.chkrow .body{flex:1;min-width:0}
.done .t{text-decoration:line-through;color:var(--faint)}
.prog{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:4px 0 12px}
.prog i{display:block;height:100%;background:var(--accent);transition:width .2s}
.tnum{color:var(--faint);font-variant-numeric:tabular-nums;font-size:12px;margin-right:4px}

/* ---------- requirements / tests ---------- */
.rid{font-family:var(--mono);font-size:11.5px;font-weight:700;color:var(--sub)}
.req-t{font-size:14.5px;margin:6px 0 4px}
.req-t .kw{color:var(--accent);font-weight:700}
.refs{margin-top:6px;font-size:12px}
.scn{margin-top:10px;background:var(--bg)}
.scn-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tag{font-family:var(--mono);font-size:11px;color:var(--sub)}
.gk{list-style:none;padding:0;margin:6px 0 0;font-size:13px}
.gk li{padding:2px 0 2px 8px;border-left:3px solid var(--line);margin:0}
.gk li.k-g{border-left-color:var(--new)} .gk li.k-w{border-left-color:var(--accent)} .gk li.k-t{border-left-color:var(--chg)}
.gk .kw{font-weight:700;margin-right:4px}
.gk .k-g>.kw{color:var(--new)} .gk .k-w>.kw{color:var(--accent)} .gk .k-t>.kw{color:var(--chg)}
.ph{font-family:var(--mono);font-size:.9em;color:var(--accent)}
.gt{width:auto;margin:4px 0 6px}
.gt td,.gt th{border:1px solid var(--line);padding:2px 8px}

/* ---------- drawer ---------- */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .15s;z-index:30}
#scrim.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--panel);border-left:1px solid var(--line);z-index:31;transform:translateX(102%);transition:transform .18s ease;display:flex;flex-direction:column;box-shadow:-8px 0 24px rgba(0,0,0,.08)}
#drawer.on{transform:none}
.dw-head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line)}
.dw-head .k{font-size:12px;color:var(--sub);font-weight:600}
#dw-body{padding:14px 16px 40px;overflow:auto}
#dw-body h3{margin:0 0 4px;font-size:18px}
.hit-n{color:var(--sub);font-size:13px;margin-bottom:10px}

/* ---------- notes ---------- */
.nb{border:0;background:none;cursor:pointer;color:var(--faint);font-size:13px;padding:0 5px;border-radius:5px;line-height:1.5;margin-left:auto;flex:0 0 auto}
.nb:hover{color:var(--accent);background:var(--accent-soft)}
.nb.has{color:var(--panel);background:var(--mid)}
.hero>.nb{float:right}
.path{font-family:var(--mono);font-size:11px;color:var(--faint);word-break:break-all}
.note-ta{width:100%;min-height:110px;font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);resize:vertical}
.note-ta:focus{outline:2px solid var(--accent);outline-offset:-1px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.btn.pri:hover{color:var(--panel);opacity:.9}
.btn:disabled{opacity:.45;cursor:default}
.nl{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0}
.nl.stale{opacity:.55}
.nl .txt{white-space:pre-wrap;margin-top:2px}
#seltip{position:fixed;z-index:40;display:none;padding:4px 10px;font-size:12.5px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
#seltip .pp{font-family:var(--mono);font-size:10.5px;opacity:.8;margin-left:6px}
</style>
</head>
<body>
<header>
  <div class="ttl"><h1 id="h-title"></h1><div class="sum" id="h-sum"></div></div>
  <div class="tools">
    <input id="q" type="search" placeholder="検索（ / ）" autocomplete="off">
    <button class="btn" id="notesBtn" title="✎ で書いた修正メモの一覧・コピー">修正依頼<span id="notesN"></span></button>
    <button class="btn" id="toggleAll" title="折りたたみをまとめて開閉">すべて展開</button>
  </div>
</header>
<div id="warn"></div>
<div class="wrap">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<button id="seltip" class="btn pri" type="button">✎ この箇所にメモ<span class="pp"></span></button>
<div id="scrim"></div>
<aside id="drawer" aria-hidden="true">
  <div class="dw-head"><span class="k" id="dw-kind"></span><button class="btn" id="dw-close" aria-label="閉じる">✕</button></div>
  <div id="dw-body"></div>
</aside>

<script type="application/json" id="design-data">
{
  "meta": {"title": "設計ビューア（テンプレート）", "summary": "scripts/build.js で JSON を流し込むと、ここに設計が表示されます", "status": "draft"},
  "overview": {"goal": "テンプレートの表示確認", "tldr": ["データは design-data の JSON だけを差し替える", "HTML/CSS/JS は編集しない"]},
  "components": [
    {"id": "json", "name": "design.json", "layer": "入力", "kind": "file", "status": "new", "summary": "設計データ"},
    {"id": "build", "name": "build.js", "layer": "変換", "kind": "script", "status": "existing", "summary": "検証して埋め込む"},
    {"id": "html", "name": "design.html", "layer": "出力", "kind": "file", "status": "new", "summary": "このページ"}
  ],
  "edges": [{"from": "json", "to": "build", "label": "読込"}, {"from": "build", "to": "html", "label": "出力"}],
  "tasks": [{"id": "t1", "title": "design.json を書く", "components": ["json"]}, {"id": "t2", "title": "build.js を実行", "dependsOn": ["t1"], "components": ["build"]}]
}
</script>

<script>
(function(){
"use strict";
/* ============ utils ============ */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const arr=v=>Array.isArray(v)?v:(v==null||v===""?[]:[v]);
const trunc=(s,n)=>{s=String(s??"");return s.length>n?s.slice(0,n-1)+"…":s;};
const tw=(s,fs)=>{let w=0;for(const ch of String(s??"")){const c=ch.codePointAt(0);w+=c>0x2E7F?fs:ch===" "?fs*.3:/[A-Z0-9@%#&]/.test(ch)?fs*.66:fs*.55;}return w;};
const fit=(s,px,fs)=>{s=String(s??"");if(tw(s,fs)<=px)return s;let o="";for(const ch of s){if(tw(o+ch+"…",fs)>px)break;o+=ch;}return o+"…";};
function inline(s){return esc(s).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");}
function md(s){
  if(s==null||s==="")return "";
  if(Array.isArray(s))s=s.map(x=>"- "+x).join("\n");
  let out="";
  String(s).split("```").forEach((part,i)=>{
    if(i%2){const nl=part.indexOf("\n");const first=nl>=0?part.slice(0,nl).trim():"";
      const code=(nl>=0&&/^[\w+#.-]*$/.test(first))?part.slice(nl+1):part;
      out+=`<pre><code>${esc(code.replace(/\n$/,""))}</code></pre>`;return;}
    let para=[],list=[];
    const fp=()=>{if(para.length){out+=`<p>${para.map(inline).join("<br>")}</p>`;para=[];}};
    const fl=()=>{if(list.length){out+=`<ul>${list.map(x=>`<li>${inline(x)}</li>`).join("")}</ul>`;list=[];}};
    part.split("\n").forEach(ln=>{
      const m=ln.match(/^\s*(?:[-*・]|\d+[.)])\s+(.*)$/);
      if(m){fp();list.push(m[1]);}
      else if(!ln.trim()){fp();fl();}
      else{fl();para.push(ln);}
    });fp();fl();
  });
  return out;
}
const qa=(...xs)=>` data-q="${esc(xs.flat(3).filter(x=>x!=null&&x!=="").map(x=>typeof x==="object"?JSON.stringify(x):String(x)).join(" ").toLowerCase())}"`;

/* ============ data ============ */
let D={},parseErr=null;

function ref(type,id){

function getAt(path){
  let node=D;
  for(const sg of String(path).split("/")){
    if(Array.isArray(node)){let hit=node.find(x=>x&&x.id!=null&&String(x.id)===sg);if(hit===undefined&&/^\d+$/.test(sg))hit=node[+sg-1];node=hit;}
    else if(node&&typeof node==="object")node=node[sg];else return undefined;
    if(node===undefined)return undefined;
  }return node;
}
const resolve=path=>path==="全体"||getAt(path)!==undefined;
/* 選択した文字が item のどのフィールドにあるかを探し、path を細かくする */
function refine(path,text){
  const base=getAt(path);if(!base||typeof base!=="object")return path;
  const norm=v=>String(v).replace(/[`*…\s]/g,"").toLowerCase();
  const t=norm(String(text).replace(/^\d+\.\s*/,""));if(t.length<2)return path;
  let best=null;
  (function rec(v,p){if(best)return;
    if(typeof v==="string"||typeof v==="number"){if(norm(v).includes(t))best=p;return;}
    if(Array.isArray(v))v.forEach((x,i)=>rec(x,p+"/"+(x&&typeof x==="object"&&x.id!=null?x.id:i+1)));
    else if(v&&typeof v==="object")Object.keys(v).forEach(k=>{if(k!=="id")rec(v[k],p+"/"+k);});
  })(base,path);
  return best||path;
}

/* ---- architecture ---- */
function layers(){
  const order=[];arr(D.layers).forEach(l=>{if(!order.includes(l))order.push(l);});
  comps.forEach(c=>{const l=c.layer||"その他";if(!order.includes(l))order.push(l);});
  return order.map(l=>({l,items:comps.filter(c=>(c.layer||"その他")===l)})).filter(r=>r.items.length);
}
function archSVG(){
  const rows=layers();if(!rows.length)return "";
  const RI={},CI={};rows.forEach((r,ri)=>r.items.forEach((c,ci)=>{RI[c.id]=ri;CI[c.id]=ci;}));
  const okE=edges.filter(e=>e.from in RI&&e.to in RI&&e.from!==e.to);
  const sameAdj=okE.some(e=>RI[e.from]===RI[e.to]&&Math.abs(CI[e.from]-CI[e.to])===1);
  const arcTop=okE.some(e=>RI[e.from]===0&&RI[e.to]===0&&Math.abs(CI[e.from]-CI[e.to])>1);
  const W=170,H=56,GX=sameAdj?76:30,GY=78,PL=92,PT=arcTop?44:14,PR=14;
  const maxN=Math.max(...rows.map(r=>r.items.length));
  const CW=maxN*W+(maxN-1)*GX, TW=PL+CW+PR, TH=PT+14+rows.length*H+(rows.length-1)*GY;
  const P={};
  rows.forEach((r,ri)=>{const rw=r.items.length*W+(r.items.length-1)*GX,x0=PL+(CW-rw)/2,y=PT+ri*(H+GY);r.y=y;
    r.items.forEach((c,ci)=>{P[c.id]={x:x0+ci*(W+GX),y,ri,ci,cx:x0+ci*(W+GX)+W/2};});});
  // ports: b=bottom t=top l=left r=right. spread multiple edges on the same side
  const E2=okE.map(e=>{
    const s=P[e.from],t=P[e.to];let ss,ts;
    if(t.ri>s.ri){ss="b";ts="t";}else if(t.ri<s.ri){ss="t";ts="b";}
    else if(Math.abs(t.ci-s.ci)===1){ss=t.ci>s.ci?"r":"l";ts=t.ci>s.ci?"l":"r";}
    else{ss="t";ts="t";}
    return {e,s,t,ss,ts};});
  const ports={};
  E2.forEach(o=>{(ports[o.e.from+"|"+o.ss]=ports[o.e.from+"|"+o.ss]||[]).push([o,"s",o.t.cx]);(ports[o.e.to+"|"+o.ts]=ports[o.e.to+"|"+o.ts]||[]).push([o,"t",o.s.cx]);});
  Object.entries(ports).forEach(([k,list])=>{const side=k.slice(k.lastIndexOf("|")+1),span=(side==="l"||side==="r")?H-20:W-30;
    list.sort((a,b)=>a[2]-b[2]);const n=list.length,step=Math.min(side==="l"||side==="r"?14:22,span/Math.max(1,n-1));
    list.forEach(([o,w],i)=>{o[w+"off"]=(i-(n-1)/2)*step;});});
  let s=`<svg class="arch" viewBox="0 0 ${TW} ${TH}" style="width:100%;max-width:${TW}px;min-width:${Math.round(TW*0.62)}px;margin:0 auto" role="img" aria-label="構成図">
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M0,0L10,5L0,10z"/></marker></defs>`;
  rows.forEach(r=>{s+=`<rect class="band" x="4" y="${r.y-8}" width="${TW-8}" height="${H+16}" rx="8"/><text class="layer" x="12" y="${r.y+H/2+4}">${esc(fit(r.l,PL-18,11.5))}</text>`;});
  const placed=[],labels=[];
  E2.forEach(o=>{
    const {e,s:a,t:b}=o;const sx=a.cx+(o.soff||0),tx=b.cx+(o.toff||0);let d,lx,ly;
    if(o.ss==="b"){const sy=a.y+H,ty=b.y,m=(ty-sy)/2;d=`M${sx},${sy} C${sx},${sy+m} ${tx},${ty-m} ${tx},${ty}`;lx=(sx+tx)/2;ly=(sy+ty)/2;}
    else if(o.ts==="b"){const sy=a.y,ty=b.y+H,m=(sy-ty)/2;d=`M${sx},${sy} C${sx},${sy-m} ${tx},${ty+m} ${tx},${ty}`;lx=(sx+tx)/2;ly=(sy+ty)/2;}
    else if(o.ss==="r"||o.ss==="l"){const r=o.ss==="r",x1=r?a.x+W:a.x,x2=r?b.x:b.x+W,y1=a.y+H/2+(o.soff||0),y2=b.y+H/2+(o.toff||0);
      d=`M${x1},${y1} L${x2},${y2}`;lx=(x1+x2)/2;ly=(y1+y2)/2;o.side=true;}
    else{const y=a.y,up=Math.min(38,22+Math.abs(tx-sx)*0.05);d=`M${sx},${y} C${sx},${y-up} ${tx},${y-up} ${tx},${y}`;lx=(sx+tx)/2;ly=y-up*0.75;}
    const tip=`<title>${esc(nameOf(e.from))} → ${esc(nameOf(e.to))}${e.label?"："+esc(e.label):""}</title>`;
    s+=`<g class="edge" data-from="${esc(e.from)}" data-to="${esc(e.to)}"><path d="${d}" marker-end="url(#ah)"/>${tip}</g>`;
    if(e.label){
      const t=fit(e.label,o.side?GX-14:140,11),w=tw(t,11)+12;
      const onNode=(x,y)=>!o.side&&Object.values(P).some(n=>x+w/2>n.x-2&&x-w/2<n.x+W+2&&y+9>n.y-2&&y-9<n.y+H+2);
      const hit=(x,y)=>onNode(x,y)||placed.some(r=>Math.abs(r.x-x)<(r.w+w)/2+4&&Math.abs(r.y-y)<19);
      let best=ly,bx=lx;
      const cand=[];for(const dy of [0,19,-19,38,-38])for(const dx of [0,-(w/2+8),w/2+8,-(w+16),w+16])cand.push([dx,dy]);
      for(const [dx,dy] of cand){if(!hit(lx+dx,ly+dy)){bx=lx+dx;best=ly+dy;break;}}
      placed.push({x:bx,y:best,w});
      labels.push(`<g class="edge" data-from="${esc(e.from)}" data-to="${esc(e.to)}"><rect class="lb" x="${bx-w/2}" y="${best-9}" width="${w}" height="18" rx="5"/><text x="${bx}" y="${best+4}" text-anchor="middle">${esc(t)}</text>${tip}</g>`);
    }
  });
  s+=labels.join("");
  comps.forEach(c=>{const p=P[c.id];if(!p)return;
    s+=`<g class="node st-${esc(c.status||"none")} k-${esc(c.kind||"")}" data-id="${esc(c.id)}" data-ref="comp:${esc(c.id)}" tabindex="0">
      <rect x="${p.x}" y="${p.y}" width="${W}" height="${H}" rx="9"/>
      <text class="nm" x="${p.cx}" y="${p.y+24}" text-anchor="middle">${esc(fit(c.name||c.id,W-16,13))}</text>
      <text class="kd" x="${p.cx}" y="${p.y+42}" text-anchor="middle">${esc(fit([KIND[c.kind]||c.kind,ST[c.status]].filter(Boolean).join(" ・ "),W-16,11))}</text>
      <title>${esc(c.name||c.id)}${c.summary?"\n"+esc(c.summary):""}</title></g>`;});
  return s+"</svg>";
}
function compCard(c){

/* ---- flows ---- */
let curFlow=0,curStep=0;
function parts(f){
  const p=[];arr(f.participants).forEach(x=>{if(!p.includes(x))p.push(x);});
  arr(f.steps).forEach(s=>[s.from,s.to].forEach(x=>{if(x!=null&&!p.includes(x))p.push(x);}));return p;
}
function seqSVG(f){
  const steps=arr(f.steps),P=parts(f);if(!P.length)return `<div class="empty">ステップがありません</div>`;
  const colW=150,pad=12,headH=40,rowH=44,top=headH+14;
  const W=pad*2+colW*P.length,Ht=top+rowH*steps.length+14,X=p=>pad+colW*P.indexOf(p)+colW/2;
  const cs=steps[curStep];
  let s=`<svg class="seq" viewBox="0 0 ${W} ${Ht}" style="width:100%;max-width:${W}px;min-width:${Math.round(W*0.7)}px;margin:0 auto" role="img" aria-label="シーケンス図">
  <defs><marker id="sa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mk" d="M0,0L10,5L0,10z"/></marker>
  <marker id="sac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mk-cur" d="M0,0L10,5L0,10z"/></marker></defs>`;
  P.forEach(p=>{const x=X(p),on=cs&&(cs.from===p||cs.to===p),isC=!!C[p];
    s+=`<line class="life" x1="${x}" y1="${headH}" x2="${x}" y2="${Ht-6}"/>
    <g class="pt${on?" on":""}${isC?" ref":""}"${isC?` data-ref="comp:${esc(p)}"`:""}><rect x="${x-colW/2+8}" y="4" width="${colW-16}" height="${headH-8}" rx="8"/>
    <text x="${x}" y="${headH/2+4}" text-anchor="middle">${esc(fit(nameOf(p),colW-28,12.5))}</text><title>${esc(nameOf(p))}</title></g>`;});
  steps.forEach((st,i)=>{

/* ---- tests (Gherkin) ---- */
const GK=/^(?:(Given|When|Then|And|But)(?=\s)|(\*)|(前提|もし|ならば|且つ|かつ|然し|しかし|但し|ただし))/;
const GKIND={Given:"g",When:"w",Then:"t","前提":"g","もし":"w","ならば":"t"};
const stepText=x=>String((x&&typeof x==="object"?x.text:x)??"");
const ph=s=>esc(s).replace(/&lt;([^&\n]+?)&gt;/g,'<span class="ph">&lt;$1&gt;</span>');
const gtable=rows=>arr(rows).length?`<table class="gt">${arr(rows).map((r,i)=>`<tr>${arr(r).map(c=>i?`<td>${ph(c)}</td>`:`<th>${ph(c)}</th>`).join("")}</tr>`).join("")}</table>`:"";
function gSteps(steps){
  let last="";
  return `<ul class="gk">${arr(steps).map(st=>{const t=stepText(st).trim(),m=t.match(GK);
    const kw=m?m[0]:"",kind=GKIND[kw]||(kw?last:"");if(GKIND[kw])last=GKIND[kw];
    const o=st&&typeof st==="object"?st:{};
    return `<li class="${kind?"k-"+kind:""}">${kw?`<span class="kw">${esc(kw)}</span>`:""}${ph(t.slice(kw.length).trim())}${gtable(o.table)}${o.doc!=null?`<pre><code>${esc(o.doc)}</code></pre>`:""}</li>`;}).join("")}</ul>`;
}
const isJa=f=>[...arr(f.background),...scnOf(f).flatMap(s=>arr(s.steps))].some(st=>/^(前提|もし|ならば|且つ|かつ|然し|しかし|但し|ただし)/.test(stepText(st).trim()));
function gherkinText(f){
  const ja=isJa(f),W=ja?{f:"機能",b:"背景",r:"ルール",s:"シナリオ",o:"シナリオアウトライン",e:"例"}:{f:"Feature",b:"Background",r:"Rule",s:"Scenario",o:"Scenario Outline",e:"Examples"};
  const tags=(t,ind)=>arr(t).length?ind+arr(t).map(x=>String(x).startsWith("@")?x:"@"+x).join(" ")+"\n":"";
  const tbl=(rows,ind)=>arr(rows).map(r=>ind+"| "+arr(r).join(" | ")+" |\n").join("");
  const steps=(xs,ind)=>arr(xs).map(st=>{const o=st&&typeof st==="object"?st:{};
    return ind+stepText(st).trim()+"\n"+tbl(o.table,ind+"  ")+(o.doc!=null?ind+'  """\n'+String(o.doc).split("\n").map(l=>ind+"  "+l).join("\n")+"\n"+ind+'  """\n':"");}).join("");
  let t=(ja?"# language: ja\n":"")+tags(f.tags,"")+`${W.f}: ${f.name||f.id}\n`;
  if(f.description)t+=String(f.description).split("\n").map(l=>"  "+l).join("\n")+"\n";
  if(arr(f.background).length)t+=`\n  ${W.b}:\n`+steps(f.background,"    ");
  let rule="";
  scnOf(f).forEach(sc=>{const ex=arr(sc.examples).filter(e=>e&&typeof e==="object");
    if((sc.rule||"")!==rule){rule=sc.rule||"";if(rule)t+=`\n  ${W.r}: ${rule}\n`;}
    const i=rule?"    ":"  ";
    t+="\n"+tags(sc.tags,i)+`${i}${ex.length?W.o:W.s}: ${sc.name||sc.id}\n`+steps(sc.steps,i+"  ");
    ex.forEach(e=>{t+=`\n${i}  ${W.e}:${e.name?" "+e.name:""}\n`+tbl([e.header,...arr(e.rows)],i+"    ");});
  });
  return t;
}

      ${r.detail?`<div class="lbl">詳細</div>${md(r.detail)}`:""}
      ${arr(r.components).length?`<div class="lbl">対象</div>${refs("comp",r.components)}`:""}
      ${SCN.length?`<div class="lbl">検証するシナリオ</div>${vs.length?vs.map(x=>`<div class="card scn">${scnBody(x,true)}</div>`).join(""):'<div class="muted small">まだありません</div>'}`:""}`;
  }else if(type==="sc"&&SC[id]){const x=SC[id];k="テストシナリオ";
    h=`<div class="small muted">${esc(x.f.name||x.f.id)}</div>${scnBody(x,false)}`;
  }else if(type==="ent"&&E[id]){const e=E[id];k="エンティティ";const rc=relChips(id);
    h=`<h3>${esc(e.name||id)}</h3><div>${badge(e.status,ST)}</div>${e.summary?`<p>${inline(e.summary)}</p>`:""}
      <div class="lbl">フィールド</div>${fieldTable(arr(e.fields))||'<div class="muted small">なし</div>'}
      ${rc?`<div class="lbl">関連</div>${rc}`:""}${e.detail?`<div class="lbl">詳細</div>${md(e.detail)}`:""}`;
  }else if(type==="task"&&T[id]){const t=T[id];k="実装タスク";const next=tasks.filter(x=>arr(x.dependsOn).includes(id));
    h=`<h3>${inline(t.title||id)}</h3><div>${t.size?`<span class="b">${esc(t.size)}</span>`:""} ${store[tKey(t)]?'<span class="b approved">完了</span>':""}</div>
      ${t.summary?`<p>${inline(t.summary)}</p>`:""}${t.detail?`<div class="lbl">内容</div>${md(t.detail)}`:""}
      ${arr(t.files).length?`<div class="lbl">ファイル</div>${files(t.files)}`:""}
      ${t.done_when?`<div class="lbl">完了条件</div>${md(t.done_when)}`:""}
      ${arr(t.components).length?`<div class="lbl">対象</div>${refs("comp",t.components)}`:""}
      ${arr(t.dependsOn).length?`<div class="lbl">前提タスク</div>${refs("task",t.dependsOn)}`:""}
      ${next.length?`<div class="lbl">後続タスク</div>${refs("task",next.map(x=>x.id))}`:""}`;
  }else return;
  const ro=refObj(type,id);
  h=`<div class="cl-row" style="margin-bottom:4px"><span class="path">${esc(ro.path)}</span>${nb(ro.path,ro.label)}</div>`+h;
  $("#dw-kind").textContent=k;$("#dw-body").innerHTML=h;showDrawer();
}
function showDrawer(){$("#dw-body").scrollTop=0;$("#drawer").classList.add("on");$("#drawer").setAttribute("aria-hidden","false");$("#scrim").classList.add("on");}

/* ============ notes (修正メモ) ============ */
function updateNotesN(){const n=Object.keys(notes()).length;$("#notesN").textContent=n?` ${n}`:"";$("#notesBtn").classList.toggle("pri",n>0);}
function openNote(path,label,quote){
  const n=notes()[path];
  let init=n?n.text:"";if(quote)init+=(init?"\n":"")+`「${trunc(quote,80)}」→ `;
  $("#dw-kind").textContent="修正メモ";
  $("#dw-body").innerHTML=`<h3>${esc(label||path)}</h3><div class="path">${esc(path)}</div>
    <div class="lbl" style="margin-top:14px">直してほしい内容</div>
    <textarea class="note-ta" id="note-ta" placeholder="例：閾値は10回にしたい／この矢印は不要／もっと詳しく">${esc(init)}</textarea>
    <div class="btns"><button class="btn pri" data-nsave="${esc(path)}" data-label="${esc(label||"")}">保存</button>${n?`<button class="btn" data-ndel="${esc(path)}">削除</button>`:""}<button class="btn" data-nlist>一覧へ</button></div>
    <div class="small muted">Ctrl+Enter で保存。メモはこのブラウザにだけ保存されます。</div>`;
  showDrawer();setTimeout(()=>{const ta=$("#note-ta");if(ta){ta.focus();ta.selectionStart=ta.value.length;}},60);
}
function notesText(){
  const ns=notes(),ks=Object.keys(ns);
  return `設計の修正依頼（${D._source||"design.json"}）\n`+ks.map(k=>{const n=ns[k];
    return `- ${k}${n.label&&k!=="全体"?`（${n.label}）`:""}: ${String(n.text).split("\n").join("\n  ")}`;}).join("\n");
}
function openNotes(){
  const ns=notes(),ks=Object.keys(ns);
  $("#dw-kind").textContent="修正依頼";
  $("#dw-body").innerHTML=`<h3>修正依頼 ${ks.length} 件</h3>
    <p class="muted small">各項目の ✎、または文字を選択して出るボタンで書いたメモの一覧です。「コピー」して Claude に貼り付けると、該当箇所だけが直されます。</p>
    <div class="btns"><button class="btn pri" data-ncopy${ks.length?"":" disabled"}>コピー</button><button class="btn" data-note="全体" data-label="設計全体">＋ 全体へのメモ</button>${ks.length?`<button class="btn" data-nclear>すべて削除</button>`:""}</div>
    ${ks.length?ks.map(k=>{const ok=resolve(k);return `<div class="nl${ok?"":" stale"}"><div class="cl-row"><span class="path">${esc(k)}${ok?"":"（見つからない）"}</span>${nb(k,ns[k].label)}</div>
      ${ns[k].label?`<div class="small"><b>${esc(ns[k].label)}</b></div>`:""}<div class="txt small">${esc(ns[k].text)}</div></div>`;}).join("")
      +`<div class="lbl" style="margin-top:14px">貼り付け用テキスト</div><textarea class="note-ta" id="note-out" readonly>${esc(notesText())}</textarea>`
      :`<div class="empty">まだメモはありません。<br>カードや詳細パネルの ✎ から書けます。</div>`}`;
  showDrawer();
}
function saveNote(path,label){
  const t=($("#note-ta")||{}).value||"";
  if(t.trim())notes()[path]={text:t.trim(),label};else delete notes()[path];
  save();updateNotesN();render();closeDrawer();
}
function copyNotes(btn){
  const t=notesText();
  const done=()=>{btn.textContent="コピーしました";setTimeout(()=>{btn.textContent="コピー";},1600);};
  const fb=()=>{const ta=$("#note-out");if(ta){ta.select();try{document.execCommand("copy");done();}catch(e){btn.textContent="上の欄から手動でコピー";}}};
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(done,fb);else fb();
}
function closeDrawer(){const ae=document.activeElement;if(ae&&$("#drawer").contains(ae))ae.blur();$("#drawer").classList.remove("on");$("#drawer").setAttribute("aria-hidden","true");$("#scrim").classList.remove("on");}

/* ============ 文字を選択 → この箇所にメモ ============ */
const SECPATH={overview:"overview",req:"requirements",tests:"features",arch:"components",data:"entities",api:"apis",decisions:"decisions",risks:"risks",tasks:"tasks"};
function noteCtx(el){
  const st=el.closest(".seq .st");if(st&&flows[curFlow])return {path:fpath(flows[curFlow])+"/steps/"+(+st.dataset.step+1),label:`ステップ ${+st.dataset.step+1}`};
  const pt=el.closest(".seq .pt[data-ref], .arch .node");if(pt){const id=pt.dataset.id||pt.dataset.ref.slice(5);return {path:"components/"+id,label:nameOf(id)};}
  const c=el.closest(".card,#dw-body");if(c){const b=c.querySelector(".nb");if(b)return {path:b.dataset.note,label:b.dataset.label};}
  if(cur==="flows"&&flows[curFlow])return {path:fpath(flows[curFlow]),label:flows[curFlow].name||""};
  return {path:SECPATH[cur]||"全体",label:(SEC[cur]||{}).label||"設計全体"};
}
let tipCtx=null,tipT;
const tip=$("#seltip");const hideTip=()=>{tip.style.display="none";tipCtx=null;};
function checkSel(){
  const sel=getSelection();const txt=sel&&sel.rangeCount?String(sel).replace(/\s+/g," ").trim():"";
  if(txt.length<2){hideTip();return;}
  const nd=sel.anchorNode,el=nd&&(nd.nodeType===1?nd:nd.parentElement);
  if(!el||!el.closest("#main,#dw-body")||el.closest("textarea,input")||$("#note-ta")&&$("#drawer").classList.contains("on")&&el.closest("#dw-body")||$("#note-out")&&el.closest("#dw-body")){hideTip();return;}
  const ctx=noteCtx(el);if(!ctx){hideTip();return;}
  tipCtx={path:refine(ctx.path,txt),label:ctx.label,quote:txt};
  $(".pp",tip).textContent=tipCtx.path;
  const r=sel.getRangeAt(0).getBoundingClientRect();tip.style.display="block";
  const w=tip.offsetWidth,h=tip.offsetHeight;
  tip.style.left=Math.max(8,Math.min(innerWidth-w-8,r.left+r.width/2-w/2))+"px";
  tip.style.top=(r.top-h-8<8?r.bottom+8:r.top-h-8)+"px";
}
document.addEventListener("selectionchange",()=>{clearTimeout(tipT);tipT=setTimeout(checkSel,220);});
window.addEventListener("scroll",hideTip,true);
tip.addEventListener("mousedown",e=>e.preventDefault());
tip.addEventListener("click",()=>{if(!tipCtx)return;const c=tipCtx;hideTip();getSelection().removeAllRanges();openNote(c.path,c.label,c.quote);});

/* ============ routing / render ============ */
let cur=SECTIONS[0].k,query="";
function renderNav(){
  $("#nav").innerHTML=SECTIONS.map(s=>`<button data-go="${s.k}" class="${!query&&s.k===cur?"on":""}"><span>${s.label}</span>${s.n?`<span class="n">${s.n}</span>`:""}</button>`).join("")
    +`<div class="hint">/ 検索<br>← → ステップ移動<br>Esc 閉じる<br>✎ 修正メモ<br>文字を選択 → メモ</div>`;
}
function render(){
  renderNav();const main=$("#main");
  if(query){
    main.innerHTML=SECTIONS.map(s=>{const body=s.r(true);return body?`<div class="sec" data-sec="${s.k}"><div class="sec-h"><h2>${s.label}</h2></div>${body}</div>`:"";}).join("");
    let hits=0;
    $$(".sec",main).forEach(sec=>{let n=0;$$("[data-q]",sec).forEach(el=>{const ok=el.dataset.q.includes(query);el.style.display=ok?"":"none";if(ok)n++;});sec.style.display=n?"":"none";hits+=n;});
    // hide empty layer groups in search
    $$(".grid3,.cards,.grid2",main).forEach(g=>{const vis=$$("[data-q]",g).some(el=>el.style.display!=="none");g.style.display=vis?"":"none";const lb=g.previousElementSibling;if(lb&&lb.classList.contains("lbl"))lb.style.display=vis?"":"none";});
    main.insertAdjacentHTML("afterbegin",`<div class="hit-n">「${esc(query)}」の検索結果：${hits} 件</div>`);
    if(!hits)main.insertAdjacentHTML("beforeend",`<div class="empty">該当なし</div>`);
    return;
  }
  const s=SEC[cur]||SECTIONS[0];
  main.innerHTML=`<div class="sec-h"><h2>${s.label}</h2><span class="lead">${esc(s.lead)}</span></div>${s.r(false)||'<div class="empty">データなし</div>'}`;
}
function go(k){if(!SEC[k])k=SECTIONS[0].k;cur=k;if(location.hash!=="#"+k)history.replaceState(null,"","#"+k);window.scrollTo(0,0);render();}
function goFlow(i,focus){
  curFlow=Math.max(0,Math.min(flows.length-1,i));curStep=0;
  if(focus){const k=arr(flows[curFlow].steps).findIndex(s=>s.from===focus||s.to===focus);if(k>=0)curStep=k;}
  query="";$("#q").value="";closeDrawer();go("flows");
}

/* ============ events ============ */
document.addEventListener("click",ev=>{
  const t=ev.target;
  const nt=t.closest("[data-note]");if(nt){openNote(nt.dataset.note,nt.dataset.label);return;}
  const ns=t.closest("[data-nsave]");if(ns){saveNote(ns.dataset.nsave,ns.dataset.label);return;}
  const nd=t.closest("[data-ndel]");if(nd){delete notes()[nd.dataset.ndel];save();updateNotesN();render();openNotes();return;}
  if(t.closest("[data-nlist]")){openNotes();return;}
  const nc=t.closest("[data-ncopy]");if(nc){copyNotes(nc);return;}
  const nx=t.closest("[data-nclear]");if(nx){if(nx.dataset.sure){store.notes={};save();updateNotesN();render();openNotes();}else{nx.dataset.sure=1;nx.textContent="もう一度押すと全削除";}return;}
  const gf=t.closest("[data-goflow]");if(gf){goFlow(+gf.dataset.goflow,gf.dataset.focus);return;}
  const g=t.closest("[data-go]");if(g){query="";$("#q").value="";closeDrawer();go(g.dataset.go);return;}
  const fl=t.closest("[data-flow]");if(fl){curFlow=+fl.dataset.flow;curStep=0;render();return;}
  const mv=t.closest("[data-mv]");if(mv){moveStep(+mv.dataset.mv);return;}
  const st=t.closest("[data-step]");if(st){curStep=+st.dataset.step;refreshFlow();return;}
  if(t.matches("input[data-store]"))return;
  const r=t.closest("[data-ref]");if(r){const i=r.dataset.ref.indexOf(":");openRef(r.dataset.ref.slice(0,i),r.dataset.ref.slice(i+1));return;}
});
document.addEventListener("change",ev=>{
  const t=ev.target;if(!t.matches("input[data-store]"))return;
  const k=t.dataset.store;if(t.checked)store[k]=1;else delete store[k];save();
  t.closest(".chkrow").classList.toggle("done",t.checked);
  const d=tasks.filter(x=>store[tKey(x)]).length;
  if($("#tdone")){$("#tdone").textContent=d;$("#tbar").style.width=(tasks.length?Math.round(d*100/tasks.length):0)+"%";}
  if($("#qleft"))$("#qleft").textContent=qs.filter(q=>!store[qKey(q)]).length;
});
// architecture hover: highlight neighbors
document.addEventListener("mouseover",ev=>{
  const n=ev.target.closest&&ev.target.closest(".arch .node");const svg=$(".arch");if(!svg)return;
  if(!n){if(svg.classList.contains("focus")){svg.classList.remove("focus");$$(".on",svg).forEach(x=>x.classList.remove("on"));}return;}
  const id=n.dataset.id;$$(".on",svg).forEach(x=>x.classList.remove("on"));svg.classList.add("focus");n.classList.add("on");
  $$(".edge",svg).forEach(e=>{if(e.dataset.from===id||e.dataset.to===id){e.classList.add("on");const o=e.dataset.from===id?e.dataset.to:e.dataset.from;const on=$(`.node[data-id="${CSS.escape(o)}"]`,svg);if(on)on.classList.add("on");}});
});
document.addEventListener("keydown",ev=>{
  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test((ev.target.tagName||""));
  if(ev.key==="Enter"&&(ev.ctrlKey||ev.metaKey)&&ev.target.id==="note-ta"){const b=$("[data-nsave]");if(b)b.click();return;}
  if(ev.key==="Escape"){if($("#drawer").classList.contains("on"))closeDrawer();else if(query){query="";$("#q").value="";render();}else if(typing)ev.target.blur();return;}
  if(typing)return;
  if(ev.key==="/"){ev.preventDefault();$("#q").focus();return;}
  if(ev.key==="Enter"&&ev.target.closest&&ev.target.closest(".arch .node")){const id=ev.target.dataset.id;openRef("comp",id);return;}
  if(cur==="flows"&&!query&&(ev.key==="ArrowRight"||ev.key==="ArrowLeft")){ev.preventDefault();moveStep(ev.key==="ArrowRight"?1:-1);}
});
let qt;$("#q").addEventListener("input",e=>{clearTimeout(qt);qt=setTimeout(()=>{query=e.target.value.trim().toLowerCase();render();},120);});
$("#toggleAll").addEventListener("click",()=>{expandAll=!expandAll;$("#toggleAll").textContent=expandAll?"すべて折りたたむ":"すべて展開";$$("#main details").forEach(d=>d.open=expandAll);});
$("#scrim").addEventListener("click",closeDrawer);$("#notesBtn").addEventListener("click",openNotes);updateNotesN();$("#dw-close").addEventListener("click",closeDrawer);
window.addEventListener("hashchange",()=>{const k=location.hash.slice(1);if(SEC[k]&&k!==cur){query="";$("#q").value="";go(k);}});

go(location.hash.slice(1)||SECTIONS[0].k);
})();
</script>
</body>
</html>
